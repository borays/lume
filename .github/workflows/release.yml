name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的版本标签（例如 v1.0.1）"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Build .app
        run: |
          cd lume
          ./build-app.sh

      - name: Resolve version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" lume/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package DMG
        run: |
          STAGE=$(mktemp -d)
          cp -R lume/dist/Lume.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "Lume ${{ steps.version.outputs.version }}" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "Lume-${{ steps.version.outputs.version }}.dmg"

      - name: Package source zip
        run: |
          git archive \
            --format=zip \
            --prefix="lume-${{ steps.version.outputs.version }}/" \
            -o "lume-${{ steps.version.outputs.version }}-source.zip" \
            HEAD

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lume-${{ steps.version.outputs.version }}
          path: |
            Lume-*.dmg
            lume-*-source.zip
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          NOTES=$(mktemp)
          TMP=$(mktemp -d)
          : > "$TMP/新增"; : > "$TMP/修复"; : > "$TMP/优化"; : > "$TMP/文档"; : > "$TMP/其他"

          git log --pretty=format:'%s|%h%n' "$RANGE" | while IFS='|' read -r subject hash; do
            [ -z "$subject" ] && continue
            case "$subject" in
              Merge*) continue ;;
              "chore: 版本号"*) continue ;;
              feat:*) text="${subject#feat: }"; section="新增" ;;
              feat\(*) text="${subject#*): }"; section="新增" ;;
              fix:*) text="${subject#fix: }"; section="修复" ;;
              fix\(*) text="${subject#*): }"; section="修复" ;;
              refactor:*|perf:*|style:*) text="${subject#*: }"; section="优化" ;;
              docs:*) text="${subject#docs: }"; section="文档" ;;
              *) text="$subject"; section="其他" ;;
            esac
            printf -- "- %s (%s)\n" "$text" "$hash" >> "$TMP/$section"
          done

          echo "## 变更内容" > "$NOTES"
          echo >> "$NOTES"
          for section in 新增 修复 优化 文档 其他; do
            if [ -s "$TMP/$section" ]; then
              printf '### %s\n\n' "$section" >> "$NOTES"
              cat "$TMP/$section" >> "$NOTES"
              echo >> "$NOTES"
            fi
          done
          if [ -n "$PREV" ]; then
            printf '**Full Changelog**: %s/%s/compare/%s...%s\n' "$SERVER" "$REPO" "$PREV" "$TAG" >> "$NOTES"
          else
            printf '**Full Changelog**: %s/%s/commits/%s\n' "$SERVER" "$REPO" "$TAG" >> "$NOTES"
          fi
          cat "$NOTES"

          FILES=(
            "Lume-${{ steps.version.outputs.version }}.dmg"
            "lume-${{ steps.version.outputs.version }}-source.zip"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "微光 Lume ${{ steps.version.outputs.version }}" \
              --notes-file "$NOTES"
          fi
